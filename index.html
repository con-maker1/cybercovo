<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Cyber Covo 1</title>
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyber Covo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Barlow+Condensed:wght@800&display=swap">
<style>
:root{--felt:#0f4a38;--felt2:#093226;--ink:#f3efe4;--brass:#d9a441;--red:#c94a4a;--mut:#9cc2b2;--line:#2b7160;--bg:radial-gradient(ellipse at 50% 0,#0f4a38,#093226 70%);--cbg:#fffdf6;--c0:#14181c;--c1:#c62828;--c2:#c62828;--c3:#14181c;--b1:#7a1f2b;--b2:#5e1520}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);background-attachment:fixed;color:var(--ink);font:18px/1.4 var(--st-font)}
body{padding:calc(44px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto;position:relative;z-index:1}
h1{font-size:30px;margin:28px 0 4px;text-align:center;letter-spacing:.5px}
.sub{color:var(--mut);text-align:center;margin:0 0 18px}
input,button{font:inherit;font-family:var(--st-font)}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0a3a2c;color:var(--ink);font-size:16px;margin:6px 0}
button{font-weight:700;border:0;border-radius:12px;padding:14px;background:var(--brass);color:#2a1d00;cursor:pointer;width:100%}
button:active{transform:scale(.98)}
button.sec{background:#1d5c49;color:var(--ink)}
button.red{background:var(--red);color:#fff}
button.sm{padding:8px;font-size:13px}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;margin:8px 0}
.panel{background:rgba(0,0,0,.22);border-radius:14px;padding:12px;margin:10px 0}
.board{display:flex;gap:6px;justify-content:center}
.card{width:calc(53px*var(--cs,1));height:calc(74px*var(--cs,1));border-radius:7px;background:var(--cbg);color:var(--c0);position:relative;display:flex;align-items:center;justify-content:center;font:700 calc(23px*var(--cs,1)) var(--st-font);box-shadow:0 2px 5px #0007;flex:none}
.card.s0{color:var(--c0)}.card.s1{color:var(--c1)}.card.s2{color:var(--c2)}.card.s3{color:var(--c3)}
.card.back{background:var(--bbg);color:transparent}
.card.empty{background:rgba(255,255,255,.07);box-shadow:none}
.card.big{width:calc(90px*var(--cs,1));height:calc(124px*var(--cs,1));font-size:calc(39px*var(--cs,1));border-radius:10px}
.pot{text-align:center;color:var(--brass);font-weight:700;margin:10px 0 2px;font-size:18px}
.ph{text-align:center;color:var(--mut);font-size:14px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;margin:5px 0;background:rgba(0,0,0,.2);border:2px solid transparent}
.pl.turn{border-color:var(--brass);background:rgba(217,164,65,.16)}
.pl.out{opacity:.45}
.pl .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .mini{display:flex;gap:3px}
.pl .mini .card{width:28px;height:39px;font-size:13px;border-radius:4px}
.tag{font:13px var(--st-font);color:var(--mut);white-space:normal}
.d{display:inline-block;background:var(--brass);color:#000;border-radius:50%;width:20px;height:20px;text-align:center;font:700 11px/20px var(--st-font);flex:none}
.log{font:13px var(--st-font);color:var(--mut);min-height:36px}
.msg{text-align:center;color:var(--brass);font-weight:700;margin:8px 0}
.code{font:800 26px var(--st-font);letter-spacing:6px;color:var(--brass)}
.mine{display:flex;gap:10px;justify-content:center;margin:8px 0}
.mine.fold{opacity:.4}
input[type=range]{width:100%;accent-color:var(--brass)}
.q{display:flex;gap:6px}
#vc{display:none;position:fixed;left:14px;right:14px;bottom:max(12px,env(safe-area-inset-bottom));max-width:452px;margin:0 auto;z-index:5}
#tk{padding:20px;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 4px 14px #0008}
#tk.live{background:var(--red);color:#fff}
.cs{display:flex;gap:4px;align-items:flex-end;justify-content:center;min-height:30px;margin:6px 0;flex:none}
.col{display:flex;flex-direction:column;align-items:center}
.chip{position:relative;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--k1);color:var(--k2);border:4px dashed var(--k2);box-shadow:0 2px 0 #0008,inset 0 0 0 2px var(--k1),0 0 var(--kg,0px) var(--k2);font:700 10px var(--st-font);font-style:normal;box-sizing:border-box}
.col>.chip+.chip{margin-top:-18px}
.cs.sm{min-height:18px;margin:0}
.cs.sm .chip{width:17px;height:17px;border-width:3px;font-size:0}
.cs.sm .chip+.chip{margin-top:-12px}
#bgc{display:none;position:fixed;inset:0;width:100%;height:100%;z-index:0}
#crt{display:none;position:fixed;inset:0;z-index:15;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
.fan{display:flex;justify-content:center;align-items:flex-start;height:165px;margin:26px 0 6px}
.fc{transform:rotate(var(--r)) translateY(var(--y));animation:bobc 3.2s ease-in-out infinite;animation-delay:var(--d)}
.fc+.fc{margin-left:-26px}
.arcade .fc .card{box-shadow:0 0 0 3px #1a1020,0 0 18px var(--cgl,transparent),0 8px 0 #0008}
@keyframes bobc{50%{transform:rotate(var(--r)) translateY(calc(var(--y) - 9px))}}
.ttl{display:flex;flex-wrap:wrap;justify-content:center;gap:0 .35em;margin:6px 0 4px;font-size:clamp(40px,13vw,62px);line-height:1.05;font-weight:700;text-shadow:-3px 0 #1a1020,3px 0 #1a1020,0 -3px #1a1020,0 3px #1a1020,-3px -3px #1a1020,3px 3px #1a1020,-3px 3px #1a1020,3px -3px #1a1020,0 8px 0 #1a1020}
.ttl i{font-style:normal;display:inline-block;animation:bob 1.7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.ttl i,.fc{animation:none}}
#bar{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;display:none;gap:6px;z-index:6}
#bar button{width:auto;padding:6px 10px;font-size:12px;background:#0007;color:var(--ink)}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:16px var(--st-font);margin:4px 0}
#cfg{display:none;position:fixed;inset:0;z-index:30;background:#000b;overflow:auto;padding:20px 14px}
.sheet{max-width:440px;margin:0 auto;background:#121a17;border:1px solid var(--line);border-radius:16px;padding:16px}
.sheet h2{margin:0 0 4px;font-size:22px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.opt{width:auto;padding:8px 12px;font-size:14px;background:#1d3a30;color:var(--ink)}
.opt.on{background:var(--brass);color:#2a1d00}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.toast{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:999px;background:#000c;font:700 16px var(--st-font);border:2px solid currentColor;white-space:nowrap;animation:tin .25s ease-out,tout .3s 1.35s forwards}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}}
@keyframes tout{to{opacity:0}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:radial-gradient(circle,#0000 15%,#8a0000cc 100%);animation:tout .4s 2.3s forwards}
.ov.win{background:radial-gradient(circle,#0000 25%,#d9a441bb 100%)}
.faces{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.face{position:relative;width:var(--s);text-align:center}
.face img,.face .ini{width:var(--s);height:var(--s);border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 50px #f00c;animation:zoom .35s cubic-bezier(.2,1.6,.4,1)}
.ov.fear img,.ov.allin img{filter:saturate(1.4) contrast(1.15);animation:zoom .35s cubic-bezier(.2,1.6,.4,1),trem .1s .35s infinite}
.ov.win img,.ov.win .ini{box-shadow:0 0 50px #fc4c;animation:zoom .35s cubic-bezier(.2,1.6,.4,1)}
.face .ini{display:flex;align-items:center;justify-content:center;background:#222;color:#fff;font:900 90px var(--st-font)}
.face .nm{font:700 15px var(--st-font);margin-top:6px;text-shadow:0 2px 4px #000}
.sw{position:absolute;top:6%;font-size:30px;animation:drip 1s infinite}
.sw.s1{right:8%}.sw.s2{left:8%;animation-delay:.5s}
.ov.win .sw{display:none}
.tt{font:900 clamp(26px,9vw,44px)/1.05 var(--st-font);text-align:center;color:#fff;text-shadow:0 0 18px #f00,0 3px 0 #000;animation:zoom .3s}
.st{font:600 15px var(--st-font);text-align:center;text-shadow:0 2px 4px #000}
@keyframes zoom{from{transform:scale(.2);opacity:0}}
@keyframes trem{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,2px) rotate(-1.5deg)}75%{transform:translate(3px,-2px) rotate(1.5deg)}}
@keyframes drip{from{transform:translateY(-8px);opacity:1}to{transform:translateY(46px);opacity:0}}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
#app.shk{animation:shk .5s}
.cf{position:absolute;top:-20px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){#app.shk,.face img,.sw{animation:none}}

/* ===== STILE "Covo Arcade" =====
   Font pixel, pannelli spessi con ombra, pulsanti a rilievo, contorni scuri, schermo CRT.
   Parametri e regole: vedi STILE-Covo-Arcade.md e il blocco STYLE nello script. */
:root{--st-font:"Pixelify Sans","Courier New",monospace;--st-ink:#1a1020;--st-panel:rgba(29,42,51,.9);--st-edge:#3a505c;--st-drop:#0d1519;--st-red:#fe5f55;--st-blue:#009dff;--st-r:12px;--st-press:5px}
.arcade input,.arcade button,.arcade select{font-family:inherit}
.arcade button{font-size:18px;letter-spacing:.5px;border-radius:var(--st-r);box-shadow:0 var(--st-press) 0 rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.arcade button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.arcade button.sm,.arcade .opt{box-shadow:0 3px 0 rgba(0,0,0,.45)}
.arcade button.sm{font-size:14px}
.arcade .opt{font-size:15px}
.arcade .panel{background:var(--st-panel);border:4px solid var(--st-edge);border-radius:14px;box-shadow:0 6px 0 var(--st-drop)}
.arcade input[type=text],.arcade select{background:#0f181d;border:3px solid var(--st-edge);color:#fff;font-size:18px}
.arcade .sub{color:#d6e2e8;font-size:18px;text-shadow:0 2px 0 var(--st-ink)}
.arcade .pot,.arcade .msg,.arcade .ph,.arcade .code{text-shadow:0 2px 0 var(--st-ink)}
.arcade .card{border:2px solid var(--cbd,transparent);box-shadow:0 0 0 2px var(--st-ink),0 0 12px var(--cgl,transparent),0 4px 0 rgba(0,0,0,.5);text-shadow:0 0 6px var(--cgl,transparent)}
.arcade .card.back{border-color:var(--bbd,transparent);text-shadow:none}
.arcade .card.empty{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);box-shadow:none}
.arcade .pl{border-width:3px;border-radius:10px}
.arcade #mk,.arcade #go{color:#fff}
.arcade #mk,.arcade button.red{background:var(--st-red)}
.arcade #go{background:var(--st-blue)}
#crt.soft{opacity:.45}
.n1 .cm-grid{grid-template-rows:1fr}
.srows{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.srow{display:flex;align-items:center;gap:10px;border:3px solid var(--st-edge);border-radius:12px;padding:6px 8px;background:rgba(0,0,0,.25)}
.sthumb{width:64px;height:64px;flex:none;border:3px solid var(--st-ink);border-radius:10px;background:#0f181d;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;cursor:pointer}
.sthumb img,.sthumb .av{width:100%;height:100%;border:0;border-radius:0}
.sinfo{flex:1;min-width:0}.sinfo b{display:block}
.sthumb .avl{width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:#222;color:#fff;font-weight:700;font-size:28px}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--st-ink);flex:none}
.ini2{display:flex;align-items:center;justify-content:center;background:#222;color:#fff;font-weight:700}
.pn .bg{z-index:1;opacity:.85;-webkit-mask-image:radial-gradient(ellipse at center,transparent 52%,#000 96%);mask-image:radial-gradient(ellipse at center,transparent 52%,#000 96%)}
.pn .ht,.pn .fxl,.pn .bub2,.pn .nmt{z-index:2}
.pn .fxl{background:radial-gradient(ellipse at center,transparent 60%,var(--ec,#0000) 145%)}
.pn .bub2{animation:popb .35s .55s both}
@keyframes popb{from{transform:scale(.3);opacity:0}}
.e-preoccupato{--ec:#2f8fc8cc}.e-arrogante{--ec:#ff9a3dcc}.e-sorpreso{--ec:#ffe14dcc}.e-felice{--ec:#ff4f9acc}.e-deluso{--ec:#5a6f88cc}.e-disperato{--ec:#4a2a7acc}.e-pensieroso{--ec:#8fbf9fcc}
@keyframes zPop{0%{transform:scale(1)}30%{transform:scale(1.32)}100%{transform:scale(1.18)}}
@keyframes zShiver{0%,100%{transform:translateX(0) scale(1.05)}25%{transform:translateX(-3px) rotate(-.6deg) scale(1.05)}75%{transform:translateX(3px) rotate(.6deg) scale(1.05)}}
@keyframes zBounce{0%,100%{transform:translateY(0) scale(1.05)}50%{transform:translateY(-7px) scale(1.1)}}
@keyframes zSlump{from{transform:translateY(-5px) scale(1.08)}to{transform:translateY(9px) scale(1.02)}}
@keyframes zSway{0%,100%{transform:rotate(-1.6deg) scale(1.06)}50%{transform:rotate(1.6deg) scale(1.06)}}
@keyframes zSmug{from{transform:scale(1.02) rotate(0)}to{transform:scale(1.22) rotate(-3deg)}}
.e-preoccupato img{animation:zShiver .25s infinite}
.e-sorpreso img{animation:zPop .55s ease-out both}
.e-felice img{animation:zBounce .65s ease-in-out infinite}
.e-deluso img{animation:zSlump 2.6s ease-out both}
.e-pensieroso img{animation:zSway 3s ease-in-out infinite}
.e-arrogante img{animation:zSmug 2.6s ease-out both}
textarea,input[type=password]{width:100%;padding:12px;border-radius:12px;border:3px solid var(--st-edge);background:#0f181d;color:#fff;font:15px var(--st-font);margin:6px 0}
#mnl{display:none;flex-basis:100%;flex-wrap:wrap;gap:6px;justify-content:flex-end}
#bar.open #mnl{display:flex}
body.cast #bar,body.cast #vc{display:none!important}
.zg{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"t" "h" "a" "p" "s";column-gap:14px}
.zone{position:relative;min-width:0;border:4px solid var(--st-edge);border-radius:14px;background:rgba(14,20,26,.55);padding:16px 12px 10px;margin:16px 0 4px}
.zt{position:absolute;top:-13px;left:12px;margin:0;background:var(--st-edge);color:#fff;font:700 13px var(--st-font);padding:0 10px;border-radius:6px;letter-spacing:1px;text-transform:uppercase}
.z-t{grid-area:t}.z-h{grid-area:h}.z-a{grid-area:a}.z-p{grid-area:p}.z-s{grid-area:s}
.zone .panel{background:none;border:0;box-shadow:none;padding:0;margin:6px 0}
#rp{position:fixed;inset:0;z-index:50;background:#000d;overflow:auto;padding:14px;display:flex;justify-content:center}
.rpb{max-width:560px;width:100%;height:fit-content;background:#121a17}
@media (min-width:900px){
  :root{--cs:1.2}
  .wrap.game{max-width:1120px}
  .zg{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"t p" "h p" "a s";align-items:start}
}
@media (max-width:420px){.zone{padding:16px 8px 8px}}
#bar{flex-wrap:wrap;justify-content:flex-end;max-width:min(94vw,520px)}
.eqb{border:3px solid var(--st-edge);border-radius:10px;padding:6px 10px;margin:6px 0;background:rgba(0,0,0,.3);text-align:center}
.eqbar{height:10px;border:2px solid var(--st-ink);background:#0f181d;margin-top:4px}
.eqbar i{display:block;height:100%;background:var(--brass)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:13px;text-align:center}
.slot .th{width:100%;aspect-ratio:3/4;border:3px solid var(--st-edge);border-radius:10px;background:#0f181d;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.pn img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
#phv{position:fixed;inset:0;z-index:40;background:#000d;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:10px;gap:8px}
.phone{border:10px solid #111;border-radius:36px;overflow:hidden;background:#000;transform-origin:top center;box-shadow:0 0 0 3px var(--st-edge);flex:none}
.phone iframe{border:0;display:block}
.pot.h2{color:#ffb347}.pot.h3{color:#ff5a4a;animation:throb .7s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.12)}}
.bub{position:absolute;padding:5px 14px;background:#fff;color:#111;border:4px solid #111;border-radius:16px;font:700 20px var(--st-font);white-space:nowrap;box-shadow:3px 3px 0 var(--c,#111);z-index:3}
.bub::after{content:"";position:absolute;left:20px;bottom:-16px;border:8px solid transparent;border-top:12px solid #111}
.cmx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,520px);height:min(86vh,780px);background:#f4efe0;border:5px solid #111;box-shadow:8px 8px 0 #111,0 0 0 9999px rgba(0,0,0,.62);padding:12px;pointer-events:auto;animation:pgIn .25s ease-out,tout .4s var(--hold,3s) forwards}
@keyframes pgIn{from{transform:translate(-50%,-50%) scale(.8) rotate(-3deg);opacity:0}}
@keyframes slam{from{transform:scale(1.7) rotate(10deg);opacity:0}}
.cm-title{position:absolute;top:-22px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#fcee0a;color:#111;border:4px solid #111;padding:2px 16px;font:700 28px var(--st-font);white-space:nowrap;box-shadow:4px 4px 0 #111;z-index:4}
.l3 .cm-title{background:#ff3b3b;color:#fff}
.cm-grid{display:grid;gap:10px;height:100%}
.n2 .cm-grid{grid-template-rows:1fr 1fr}
.n3 .cm-grid,.n4 .cm-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.n3 .pn:first-child{grid-column:1/3}
.n5 .cm-grid,.n6 .cm-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr}
.n5 .pn:nth-child(3){grid-column:1/3}
.pn{position:relative;overflow:hidden;min-height:0;border:4px solid #111;transform:rotate(var(--r));animation:slam .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*.22s)}
.pn .bg,.pn img,.pn .ini,.pn .ht,.pn .fxl{position:absolute;inset:0;width:100%;height:100%}
.pn img{object-fit:cover;z-index:0}
.pn .ini{display:flex;align-items:center;justify-content:center;background:#222;color:#fff;font:900 80px var(--st-font)}
.pn .ht{background:radial-gradient(#0003 1px,transparent 1.5px) 0 0/5px 5px;mix-blend-mode:multiply}
.pn .fxl{font:700 40px var(--st-font);pointer-events:none}
.pn .fxl::before,.pn .fxl::after{position:absolute;text-shadow:2px 2px 0 #111}
.pn .bub2{position:absolute;left:8px;bottom:8px;max-width:75%;background:#fff;color:#111;border:3px solid #111;border-radius:12px;padding:2px 10px;font:700 19px var(--st-font);box-shadow:3px 3px 0 #111}

function eval5(c){
  const cnt={};c.forEach(x=>cnt[x.r]=(cnt[x.r]||0)+1);
  const g=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]||b-a);
  const flush=c.every(x=>x.s==c[0].s);
  const rs=c.map(x=>x.r).sort((a,b)=>b-a);
  let st=g.length==5&&rs[0]-rs[4]==4,hi=rs[0];
  if(g.length==5&&rs.join()=="14,5,4,3,2"){st=true;hi=5}
  const k=g.map(r=>cnt[r]).join("");
  if(st&&flush)return[8,hi];
  if(k=="41")return[7,...g];
  if(k=="32")return[6,...g];
  if(flush)return[5,...rs];
  if(st)return[4,hi];
  if(k=="311")return[3,...g];
  if(k=="221")return[2,...g];
  if(k=="2111")return[1,...g];
  return[0,...rs];
}

}
function winComic(ws,hl){
  if(hl<2||!ws.length)return null;
  const P=G.players,w=ws[0],los=P.filter(q=>!ws.includes(q)&&q.inHand&&q.total>0).sort((a,b)=>b.total-a.total).slice(0,4);
  if(!los.length)return null;
  return{lvl:hl,title:"VITTORIA!",panels:[{n:w.name,e:hl>=3?"arrogante":"felice"},...ws.slice(1,2).map(q=>({n:q.name,e:"felice"})),...los.map(q=>({n:q.name,e:q.allin&&q.chips==0?"disperato":"deluso"}))].slice(0,6)};

function toggleTalk(k){const sp=G.specs[k];if(!sp)return;sp.talk=!sp.talk;L(sp.talk?`${sp.name} può parlare`:`${sp.name} non può più parlare`);broadcast()}

  broadcast();

function startHand(){
  const P=G.players;
  P.forEach(p=>{if(p.ai&&p.chips==0)p.chips=START});
  P.forEach(p=>{p.hand=[];p.bet=0;p.total=0;p.folded=false;p.allin=false;p.acted=false;p.inHand=p.chips>0;p.show=false;p.res="";p.won=0});
  const act=P.filter(p=>p.inHand);
  if(act.length<2){G.msg="Servono almeno 2 giocatori con fiches";G.phase="lobby";broadcast();return}
  G.deck=buildDeck(G.dk);
  for(let i=51;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[G.deck[i],G.deck[j]]=[G.deck[j],G.deck[i]]}
  G.board=[];G.msg="";G.cur=0;G.minRaise=BB;G.cl=0;G.rr=0;G.ck="";G.cfold=0;G.hn=(G.hn||0)+1;G.eqc={};
  G.dealer=nextIdx(G.dealer,p=>p.inHand);
  const sb=act.length==2?G.dealer:nextIdx(G.dealer,p=>p.inHand);
  const bb=nextIdx(sb,p=>p.inHand);
  P.forEach(p=>{if(p.inHand)p.hand=[G.deck.pop(),G.deck.pop()]});
  const bo=[];P.forEach(p=>p.hand.forEach(c=>{const h=c.m&&MODS[c.m]&&MODS[c.m].onDeal;if(h){const t=h(p,c);if(t){bo.push(t);L(t)}}}));
  put(P[sb],SB);put(P[bb],BB);

  G.turn=-1;broadcast();
  setTimeout(()=>{if(G.phase=="preflop"&&G.turn==-1){G.turn=bb;after()}},1900);
}

function act(i,a,to){
  const P=G.players,p=P[i];
  if(G.turn!=i||!BETPH.includes(G.phase))return;
  const need=Math.min(G.cur-p.bet,p.chips);
  if(a=="fold"){p.folded=true;L(`${p.name} passa`);EV("fold",p.name,0,[],comicFor("fold",p))}
  else if(a=="call"){const fc=P.filter(q=>q!==p&&q.allin&&!q.folded&&q.inHand&&q.bet>0&&q.bet==G.cur);put(p,need);p.acted=true;if(!need)EV("check",p.name);else if(fc.length)EV("callallin",p.name,need,fc.map(q=>q.name),comicFor("callallin",p,{need,f:fc}));else if(p.allin)EV("allin",p.name,p.bet,[],comicFor("allin",p));else EV("call",p.name,need);L(need?`${p.name} chiama ${need}${p.allin?" (all-in)":""}`:`${p.name} check`)}
  else if(a=="raise"){
    const max=p.bet+p.chips;
    const minTo=Math.min(G.cur+G.minRaise,max);
    to=Math.max(minTo,Math.min(Math.round((+to||0)/5)*5,max));
    if(to<=G.cur)return act(i,"call");
    const inc=to-G.cur;
    if(inc>=G.minRaise)G.minRaise=inc;
    put(p,to-p.bet);
    P.forEach((q,k)=>{if(k!=i)q.acted=false});
    p.acted=true;
    L(`${p.name} rilancia a ${p.bet}${p.allin?" (all-in)":""}`);G.rr=(G.rr||0)+1;EV(p.allin?"allin":"raise",p.name,p.bet,[],comicFor(p.allin?"allin":"raise",p));
  } else return;
  after();
}

function after(){
  recSnap(G.log[G.log.length-1]);
  const P=G.players;
  const live=P.filter(p=>p.inHand&&!p.folded);
  if(live.length==1)return award(live[0]);
  const able=live.filter(p=>!p.allin);
  if(!able.every(p=>p.acted&&p.bet==G.cur))
    {G.turn=nextIdx(G.turn,p=>canAct(p)&&!(p.acted&&p.bet==G.cur));broadcast();return}
  nextPhase();
}

function nextPhase(){
  const P=G.players;
  P.forEach(p=>{p.bet=0;p.acted=false});G.cur=0;G.minRaise=BB;G.rr=0;
  const d=()=>G.deck.pop();
  if(G.phase=="preflop"){G.phase="flop";G.board.push(d(),d(),d())}
  else if(G.phase=="flop"){G.phase="turn";G.board.push(d())}
  else if(G.phase=="turn"){G.phase="river";G.board.push(d())}
  else return showdown();
  const ph=G.phase;G.turn=-1;recSnap(ph.toUpperCase());broadcast();
  setTimeout(()=>{
    if(G.phase!=ph||G.turn!=-1)return;
    if(P.filter(canAct).length<2)return nextPhase();
    G.turn=nextIdx(G.dealer,canAct);broadcast();
  },ph=="flop"?2300:1800);
}

function award(w){
  const pot=G.players.reduce((s,x)=>s+x.total,0);
  const hl=heatLvl();w.chips+=pot;w.won=pot;G.phase="showdown";G.turn=-1;
  G.msg=`${w.name} vince ${pot}`;L(G.msg);EV("win",w.name,pot,[],winComic([w],hl));recSnap(G.msg);recEnd();broadcast();
}

function showdown(){
  const P=G.players,hl=heatLvl();G.phase="showdown";G.turn=-1;
  const live=P.filter(p=>p.inHand&&!p.folded);
  live.forEach(p=>{p.show=true;p.sc=best([...p.hand,...G.board]);p.res=NAMES[p.sc[0]]});
  const t=P.map(p=>p.total);
  while(t.some(x=>x>0)){
    const m=Math.min(...t.filter(x=>x>0));let pot=0;const el=[];
    P.forEach((p,i)=>{if(t[i]>0){pot+=m;t[i]-=m;if(live.includes(p))el.push(p)}});
    const pool=el.length?el:live;
    let top=pool[0].sc;pool.forEach(p=>{if(cmp(p.sc,top)>0)top=p.sc});
    const w=pool.filter(p=>cmp(p.sc,top)==0);
    const share=Math.floor(pot/w.length),rem=pot-share*w.length;
    w.forEach((p,k)=>{const a=share+(k<rem?1:0);p.chips+=a;p.won+=a});
  }
  G.msg=live.filter(p=>p.won).map(p=>`${p.name} vince ${p.won} con ${p.res}`).join(", ");
  L(G.msg);const wn=live.filter(p=>p.won).sort((x,y)=>y.won-x.won)[0];if(wn)EV("win",wn.name,wn.won,[],winComic(live.filter(p=>p.won>0),hl));recSnap(G.msg);recEnd();broadcast();
}

function rebuy(i){
  const p=G.players[i];
  if(!p||p.ai||p.chips>0||!(G.phase=="lobby"||G.phase=="showdown")||p.rb>=(G.rbmax||1))return;
  const a=REBUY[p.rb];p.chips=a;p.inv+=a;p.rb++;L(`${p.name} fa il rebuy ${p.rb}: ${a} CPT`);broadcast();
}

function viewFor(i,hv){

  const need=Math.min(G.cur-p.bet,p.chips);
  return{rbm:G.rbmax||1,pctG:!!G.pctG,rec:G.rec!==false,casterIdx:G.caster,cdelay:G.cdelay||0,eq:eqView(i),pct:!!G.pctP,heat:heatLvl(),tb:G.tb,dk:G.dk,ev:G.ev||null,voice:P.filter(x=>x.voice&&x.on).map(x=>x.pid).concat(G.specs.filter(x=>x.voice&&x.on).map(x=>x.pid)),specs:G.specs.map(x=>({n:x.name,on:x.on,talk:x.talk})),ph:G.phase,board:G.board,pot:P.reduce((s,x)=>s+x.total,0),turn:G.turn,dealer:G.dealer,me:i,host:!!hv,msg:G.msg,log:G.log.slice(-4),

    players:P.map((x,k)=>({iv:x.inv,rb:x.rb,ai:x.ai||0,n:x.name,c:x.chips,b:x.bet,f:x.folded,a:x.allin,in:x.inHand,on:x.on,won:x.won,res:x.show?x.res:"",

function broadcast(){
  if(BETPH.includes(G.phase)&&G.turn>=0){const p=G.players[G.turn];if(!p.on)return act(G.turn,G.cur-p.bet>0?"fold":"call")}

/* ---------- Rete (PeerJS, peer-to-peer) ---------- */
const rnd=()=>Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join("");
const err=m=>{const e=$("#er");if(e)e.textContent=m;else alert(m)};

let KA=0;
const peerOpts=()=>Object.assign({config:{iceServers:STYLE.net.ice.concat(STYLE.net.turn?[STYLE.net.turn]:[]),iceCandidatePoolSize:4}},STYLE.net.server||{});
const NETLOG=[],nl=m=>{NETLOG.push(Math.round(performance.now()/1000)+"s "+m);if(NETLOG.length>14)NETLOG.shift()};
const INAPP=/FBAN|FBAV|Instagram|MicroMessenger|Snapchat|TikTok|Line\/|; wv\)|WhatsApp|Telegram/i.test(navigator.userAgent);
const errD=m=>{const e=$("#er");if(e)e.innerHTML=esc(m)+`<div class="tag" style="margin-top:6px;text-align:left">Dettagli tecnici (mandali a chi ti aiuta):<br>${NETLOG.map(esc).join("<br>")||"nessuno"}</div>`;else alert(m+"\n"+NETLOG.join("\n"))};
const netErr=e=>({"peer-unavailable":"Tavolo non trovato: il codice è sbagliato oppure l’admin ha chiuso la pagina o ha perso la connessione","network":"Non riesco a raggiungere il servizio di collegamento: controlla la rete e riprova","server-error":"Il servizio di collegamento non risponde: riprova tra poco","socket-error":"Il servizio di collegamento non risponde: riprova tra poco","socket-closed":"Il collegamento al servizio si è interrotto: riprova","webrtc":"Il browser non riesce a creare il collegamento diretto: prova con un’altra rete","browser-incompatible":"Questo browser non supporta il collegamento: usa Chrome aggiornato"}[e.type]||("Errore di rete: "+e.type));
const noPeer=()=>{
  if(typeof Peer==="undefined"){errD("Non riesco a caricare il componente di collegamento: controlla la rete e ricarica la pagina");return true}
  if(typeof RTCPeerConnection==="undefined"){errD("Questo browser non supporta il collegamento tra dispositivi. Apri il link in Chrome (Android) o in Safari (iPhone), non dentro WhatsApp, Instagram o altre app.");return true}
  return false};
function createTable(name){
  if(noPeer())return;
  MYNAME=name;CODE=rnd();
  peer=new Peer("txh-"+CODE,peerOpts());setupCalls();
  peer.on("open",id=>{nl("tavolo aperto sul servizio ("+id+")");if(isHost&&G){if(view)render(view);return}isHost=true;newGame(name);G.players[0].pid=peer.id;broadcast()});
  peer.on("error",e=>{nl("errore servizio: "+e.type);if(e.type=="unavailable-id")createTable(name);else errD(netErr(e))});
  /* se il collegamento al servizio cade, i nuovi giocatori non trovano più il tavolo: lo riattacco da solo */
  peer.on("disconnected",()=>{nl("tavolo scollegato dal servizio, riconnetto");if(view)render(view);setTimeout(()=>{try{if(peer&&!peer.destroyed)peer.reconnect()}catch(x){}},1500)});
  clearInterval(KA);KA=setInterval(()=>{try{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect()}catch(x){}},15000);
  peer.on("connection",c=>{
    c.on("data",m=>onMsg(c,m));
    c.on("close",()=>{const p=G.players.find(x=>x.conn===c);if(p){p.on=false;p.voice=false;L(`${p.name} si è disconnesso`);broadcast()}else{const sp=G.specs.find(x=>x.conn===c);if(sp){sp.on=false;sp.voice=false;broadcast()}}});

function onMsg(c,m){
  if(m.t=="face"){const q=G.players.find(x=>x.conn===c)||G.specs.find(x=>x.conn===c);if(q)faceIn(q.name,m.e,m.d,c);return}
  if(m.t=="join"){
    const name=(String(m.n||"").trim().slice(0,14))||"Anonimo";
    if(G.players.some(x=>x.name==name&&x.on)||G.specs.some(x=>x.name==name&&x.on)){c.send({t:"e",m:"Nome già in uso al tavolo"});return}
    if(m.s){
      let sp=G.specs.find(x=>x.name==name&&!x.on);
      if(!sp){sp={name,talk:false,voice:false};G.specs.push(sp)}
      sp.conn=c;sp.pid=c.peer;sp.on=true;L(`${name} guarda la partita`);broadcast();sendFacesTo(c);return;
    }
    let p=G.players.find(x=>x.name==name&&!x.on);
    if(!p){
      if(G.players.length>=9){c.send({t:"e",m:"Tavolo pieno"});return}
      p=mkPlayer(name,c.peer);G.players.push(p);
    }
    p.conn=c;p.pid=c.peer;p.on=true;L(`${name} è al tavolo`);broadcast();sendFacesTo(c);
    return;
  }
  const i=G.players.findIndex(x=>x.conn===c);if(i<0){const sp=G.specs.find(x=>x.conn===c);if(sp&&m.t=="v"){sp.voice=!!m.on;broadcast()}return}
  if(m.t=="act")act(i,m.a,m.to);else if(m.t=="rebuy")rebuy(i);else if(m.t=="v"){G.players[i].voice=!!m.on;broadcast()}
}

function joinTable(code,name,spec){
  if(noPeer())return;
  MYNAME=name;
  CODE=code.toUpperCase();
  peer=new Peer(undefined,peerOpts());setupCalls();
  let done=false;nl("provo a entrare nel tavolo "+CODE);const fail=m=>{if(!done){done=true;nl("esito: "+m.slice(0,40));errD(m)}};
  const tm=setTimeout(()=>fail("Il collegamento non parte (15 secondi). Può dipendere dalla rete o dal firewall: prova a cambiare rete (Wi-Fi o dati mobili) oppure usa «Test connessione»."),15000);
  peer.on("error",e=>{clearTimeout(tm);nl("errore servizio: "+e.type);fail(netErr(e))});
  peer.on("open",()=>{
    if(hostConn&&hostConn.open)return;
    nl("servizio raggiunto, cerco il tavolo");
    hostConn=peer.connect("txh-"+CODE,{reliable:true});
    setTimeout(()=>{const pc=hostConn&&hostConn.peerConnection;if(pc)pc.addEventListener("iceconnectionstatechange",()=>{nl("rete: "+pc.iceConnectionState);if(pc.iceConnectionState=="failed")fail("Collegamento diretto bloccato dalla rete (serve un server di rilancio TURN). Prova con un’altra rete o usa «Test connessione».")})},600);
    hostConn.on("open",()=>{nl("collegato al tavolo");done=true;clearTimeout(tm);hostConn.send({t:"join",n:name,s:!!spec});sendMyFaces()});
    hostConn.on("error",e=>fail("Errore di collegamento: "+((e&&e.type)||e)));
    hostConn.on("data",m=>{if(m.t=="s")render(m.v);else if(m.t=="e")err(m.m);else if(m.t=="face")faceIn(m.n,m.e,m.d);else if(m.t=="lb")lbIn(m.d)});
    hostConn.on("close",()=>alert("Connessione persa. Ricarica la pagina e rientra con lo stesso nome per riprendere il tuo posto."));
  });
}

const send=m=>{if(isHost){if(m.t=="act")act(0,m.a,m.to);else if(m.t=="rebuy")rebuy(0);else if(m.t=="cfg")setCfg(m.k,m.v);else if(m.t=="talk")toggleTalk(m.k);else if(m.t=="ai")aiSeat(m.k);else if(m.t=="set")setOpt(m.k);else if(m.t=="rbmax"){G.rbmax=Math.max(1,Math.min(3,+m.k||1));broadcast()}else if(m.t=="end")endSession();else if(m.t=="caster"){G.caster=+m.k;broadcast()}else if(m.t=="cdelay"){G.cdelay=+m.k;broadcast()}else if(m.t=="v"){G.players[0].voice=!!m.on;broadcast()}}else if(hostConn&&hostConn.open)hostConn.send(m)};

  if(!s||FC[key]===null){ini();return d}

}

/* Facce dei giocatori: faces/<nome>-<emozione>.jpg  (emozioni: preoccupato, arrogante, sorpreso, felice, deluso, disperato, pensieroso)
   e faces/<nome>.jpg come foto base. Se manca un'emozione si usa la più vicina. */
const EMO=["preoccupato","arrogante","sorpreso","felice","deluso","disperato","pensieroso"];
const EMOCH={preoccupato:["preoccupato","pensieroso","sorpreso","paura"],arrogante:["arrogante","felice","vittoria"],sorpreso:["sorpreso","preoccupato","pensieroso","paura"],felice:["felice","vittoria","arrogante"],deluso:["deluso","pensieroso","preoccupato","paura"],disperato:["disperato","sorpreso","preoccupato","pensieroso","paura"],pensieroso:["pensieroso","preoccupato","sorpreso"]};
const CAP={preoccupato:["GULP…","Oddio…","Hmm, brutto…"],arrogante:["Ahah!","Tutto qui?","Sentite questa!"],sorpreso:["EH?!","Cosa?!","Non ci credo!"],felice:["YEAH!","Evviva!","Tutto mio!"],deluso:["…sigh","Uffa…","Peccato…"],disperato:["NOOO!","Finita…","Aiuto!"],pensieroso:["Hmm…","Vediamo…","Mah…"]};
const FAV={};
const PRB={};
function probeFaces(name){
  const s=slug(name);if(!s||PRB[s])return;PRB[s]=1;
  const o=FAV[s]||(FAV[s]={});
  ["","paura","vittoria",...EMO].forEach(k=>{
    const ex=["jpg","jpeg","png","webp"];let i=0;
    const tr=()=>{if(i>=ex.length)return;const im=new Image();im.onload=()=>{if(!o[k||"base"])o[k||"base"]=im.src};im.onerror=()=>{i++;tr()};im.src=`faces/${s}${k?"-"+k:""}.${ex[i]}`};
    tr();
  });
}
function faceUrl(name,emo){
  const get=sl=>{const o=FAV[sl]||{};for(const k of EMOCH[emo]||[emo])if(o[k])return o[k];return o.base||Object.values(o)[0]||null};
  let u=get(slug(name));
  if(!u&&STYLE.comic.fallback)u=get(slug(STYLE.comic.fallback));
  return u;
}
function comicPage(cm){
  const f=$("#fx");f.querySelectorAll(".cmx").forEach(x=>x.remove());
  const n=Math.min(6,Math.max(1,cm.panels.length)),tilt=[-1.2,1,-.8,1.4,-1,.7];
  const pg=document.createElement("div");pg.className=`cmx n${n} l${cm.lvl}`;
  const hold=cm.lvl>=3?4.2:3.2;pg.style.setProperty("--hold",hold+"s");
  pg.innerHTML=`<div class="cm-title">${esc(cm.title)}</div><div class="cm-grid">${cm.panels.slice(0,6).map((p,i)=>{
    probeFaces(p.n);const u=faceUrl(p.n,p.e),c=CAP[p.e]||[""];
    return `<div class="pn e-${p.e}" style="--i:${i};--r:${tilt[i%6]}deg"><div class="bg"></div>${u?`<img src="${u}" alt="">`:`<div class="ini">${esc(p.n.slice(0,1).toUpperCase())}</div>`}<div class="ht"></div><div class="fxl"></div><div class="bub2">${esc(c[(HID+i)%c.length])}</div><div class="nmt">${esc(p.n)}</div></div>`;
  }).join("")}</div>`;
  pg.onclick=()=>pg.remove();f.appendChild(pg);setTimeout(()=>pg.remove(),hold*1000+450);
  if(cm.lvl>=3){const a=$("#app");a.classList.remove("shk");void a.offsetWidth;a.classList.add("shk")}
}

/* ---------- Foto dei tavoli in pixel art (stile Covo Arcade) ---------- */
let PB=null,PBT=0;
function mkFilter(){
  const L=STYLE.photo.levels,tv=Array.from({length:L},(_,i)=>(i/(L-1)).toFixed(3)).join(" ");
  document.body.insertAdjacentHTML("beforeend",`<svg width="0" height="0" style="position:absolute"><filter id="arc" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="${STYLE.photo.saturate}"/><feComponentTransfer><feFuncR type="discrete" tableValues="${tv}"/><feFuncG type="discrete" tableValues="${tv}"/><feFuncB type="discrete" tableValues="${tv}"/></feComponentTransfer></filter></svg>`);
}
function drawPixel(){
  if(!PB)return;
  const c=$("#bgp canvas"),b=STYLE.photo.block,W=Math.ceil(innerWidth/b),H=Math.ceil(innerHeight/b),im=PB.im;
  c.width=W;c.height=H;
  const k=Math.max(W/im.width,H/im.height);
  c.getContext("2d").drawImage(im,(W-im.width*k)/2,(H-im.height*k)/2,im.width*k,im.height*k);
}
function pixelBg(url,dim){
  const w=$("#bgp"),tk=++PBT;
  if(!url){PB=null;w.style.display="none";return}
  const im=new Image();
  im.onload=()=>{
    if(tk!=PBT)return;
    PB={im};w.style.display="block";
    w.querySelector("i").style.background=`linear-gradient(rgba(26,16,32,${dim}),rgba(26,16,32,${dim})),linear-gradient(160deg,${STYLE.photo.tint},${STYLE.photo.tint2})`;
    drawPixel();
  };
  im.src=url;
}
addEventListener("resize",drawPixel);

/* ---------- Voci camuffate (effetti sulla voce, prima di inviarla agli altri) ---------- */
let PW=false,voiceOut=null,vg=null;
const PCODE=`class P extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(16384);this.w=0;this.ph=0;this.p=1;this.port.onmessage=e=>{this.p=e.data}}
process(I,O){const x=I[0][0],y=O[0][0];if(!x||!y)return true;const N=16384,W=2048;
for(let n=0;n<x.length;n++){this.b[this.w]=x[n];this.ph+=(1-this.p)/W;this.ph-=Math.floor(this.ph);
let s=0;for(const q of [this.ph,(this.ph+.5)%1]){let r=this.w-q*W;if(r<0)r+=N;const i=Math.floor(r),f=r-i,v=this.b[i%N]*(1-f)+this.b[(i+1)%N]*f,g=Math.sin(Math.PI*q);s+=v*g*g}
y[n]=s;this.w=(this.w+1)%N}return true}}
registerProcessor("pshift",P);`;
const mkF=(a,t,f,q)=>{const n=a.createBiquadFilter();n.type=t;n.frequency.value=f;if(q)n.Q.value=q;return n};
const mkG=(a,v)=>{const g=a.createGain();g.gain.value=v;return g};
const mkD=(a,k)=>{const w=a.createWaveShaper(),n=256,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}w.curve=c;w.oversample="2x";return w};
const mkP=(a,p)=>{if(!PW)return null;const n=new AudioWorkletNode(a,"pshift",{outputChannelCount:[1]});n.port.postMessage(p);return n};
function chain(a,list,extra){
  const L=list.filter(Boolean),I=x=>x.i||x,O=x=>x.o||x;
  for(let k=0;k<L.length-1;k++)O(L[k]).connect(I(L[k+1]));
  return{i:I(L[0]),o:O(L[L.length-1]),stop(){(extra||[]).forEach(o=>{try{o.stop()}catch(e){}})}};
}
function echo(a,t,fb,m){const i=mkG(a,1),o=mkG(a,1),d=a.createDelay(1),f=mkG(a,fb),w=mkG(a,m);d.delayTime.value=t;i.connect(o);i.connect(d);d.connect(f);f.connect(d);d.connect(w);w.connect(o);return{i,o}}
function ring(a,hz,wv,dv){const i=mkG(a,1),o=mkG(a,1),r=mkG(a,0),osc=a.createOscillator(),w=mkG(a,wv),d=mkG(a,dv);osc.frequency.value=hz;osc.connect(r.gain);osc.start();i.connect(r);r.connect(w);w.connect(o);i.connect(d);d.connect(o);return{i,o,osc}}
const VFXS={
  normal:{n:"Normale",make:a=>chain(a,[mkG(a,1)])},
  droid:{n:"Droide",make:a=>{const r=ring(a,90,.9,.3);return chain(a,[mkF(a,"highpass",250),r],[r.osc])}},
  alien:{n:"Alieno",make:a=>{const d=a.createDelay(.05),l=a.createOscillator(),lg=mkG(a,.004);d.delayTime.value=.01;l.frequency.value=7;l.connect(lg);lg.connect(d.delayTime);l.start();return chain(a,[mkG(a,1),mkP(a,1.5),d,mkF(a,"highpass",300)],[l])}},
  monster:{n:"Mostro",make:a=>chain(a,[mkG(a,1),mkP(a,.55),mkD(a,25),mkF(a,"lowpass",1800),mkG(a,.8)])},
  eng:{n:"Ingegnere",make:a=>chain(a,[mkG(a,1),mkP(a,.9),mkF(a,"lowpass",4000),echo(a,.09,.3,.3)])},
  radio:{n:"Radio",make:a=>{
    const o=mkG(a,1),m=chain(a,[mkF(a,"highpass",500),mkF(a,"lowpass",2800),mkD(a,8),mkG(a,1.2)]);m.o.connect(o);
    const b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;
    const s=a.createBufferSource(),ng=mkG(a,.02);s.buffer=b;s.loop=true;s.connect(ng);ng.connect(o);s.start();
    return{i:m.i,o,stop(){try{s.stop()}catch(e){}}};
  }},
  kidnap:{n:"Rapitore",make:a=>chain(a,[mkG(a,1),mkP(a,.7),mkF(a,"highpass",150),mkF(a,"lowpass",2600),mkD(a,3),echo(a,.045,.35,.35)])}
};
let VFX="normal";try{const v=localStorage.getItem("vfx");if(VFXS[v])VFX=v}catch(e){}
async function setupVoiceGraph(){
  const a=ac();if(!a||!a.createMediaStreamDestination)throw new Error("no audio");
  if(a.audioWorklet&&!PW){try{await a.audioWorklet.addModule(URL.createObjectURL(new Blob([PCODE],{type:"text/javascript"})));PW=true}catch(e){PW=false}}
  const dest=a.createMediaStreamDestination(),gate=mkG(a,0),mon=mkG(a,0);
  gate.connect(dest);mon.connect(a.destination);
  vg={a,src:a.createMediaStreamSource(mic),gate,mon,fx:null};
  setVoiceFx(VFX);voiceOut=dest.stream;
}
function setVoiceFx(id){
  if(!vg)return;
  if(vg.fx){try{vg.src.disconnect(vg.fx.i)}catch(e){}try{vg.fx.o.disconnect()}catch(e){}vg.fx.stop()}
  const f=VFXS[id].make(vg.a);vg.fx=f;
  vg.src.connect(f.i);f.o.connect(vg.gate);f.o.connect(vg.mon);
}

/* ---------- Voce (push to talk) ---------- */
let mic=null,calls={};
let lis=false,SIL=null,lastVL=[],vcKey="";
const silent=()=>{if(!SIL)SIL=ac().createMediaStreamDestination().stream;return SIL};
const vcK=()=>[view&&view.guest,view&&view.canTalk,!!mic,lis].join("|");
function vcUpdate(){if(vcK()!==vcKey)vcDraw()}
function setupCalls(){peer.on("call",c=>{if(!mic&&!lis)return;c.answer(voiceOut||mic||silent());hook(c)})}
function hook(c){
  calls[c.peer]=c;
  c.on("stream",s=>{let a=document.getElementById("a-"+c.peer);if(!a){a=document.createElement("audio");a.id="a-"+c.peer;a.autoplay=true;document.body.appendChild(a)}a.srcObject=s;a.play().catch(()=>{})});
  c.on("close",()=>{dropCall(c.peer);setTimeout(()=>syncVoice(lastVL),300)});
}
function dropCall(id){if(calls[id]){try{calls[id].close()}catch(e){}delete calls[id]}const a=document.getElementById("a-"+id);if(a)a.remove()}
function syncVoice(list){
  lastVL=list;if((!mic&&!lis)||!peer||!peer.id)return;
  list.forEach(id=>{if(id!=peer.id&&!calls[id]&&peer.id<id)hook(peer.call(id,voiceOut||mic||silent()))});
  Object.keys(calls).forEach(id=>{if(!list.includes(id))dropCall(id)});
}
function ptt(on){
  if(!mic)return;
  if(on&&view&&view.guest&&!view.canTalk)return;
  if(vg)vg.gate.gain.setTargetAtTime(on?1:0,vg.a.currentTime,.01);else mic.getAudioTracks().forEach(t=>t.enabled=on);
  const b=$("#tk");if(b){b.classList.toggle("live",on);b.textContent=on?"Stai parlando…":"Tieni premuto per parlare"}
}
function vcDraw(){
  vcKey=vcK();$("#bar").style.display="flex";document.body.classList.add("hasdock");
  const d=$("#vc"),g=view&&view.guest,ok=!g||view.canTalk;d.style.display="block";
  if(!ok){
    if(vg)vg.gate.gain.value=0;
    d.innerHTML=lis?'<button class="sec" disabled>Ascolti: per parlare serve il permesso dell’admin</button>':'<button class="sec" id="en">Ascolta le voci</button>';
    if($("#en"))$("#en").onclick=()=>{lis=true;send({t:"v",on:true});vcDraw()};
    return;
  }
  if(!mic){d.innerHTML=`<button class="sec" id="en">${g?"Attiva il microfono":"Attiva la voce"}</button>`;$("#en").onclick=enableVoice;return}
  d.innerHTML='<button id="tk">Tieni premuto per parlare</button>';
  const b=$("#tk");
  b.onpointerdown=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}ptt(true)};
  b.onpointerup=b.onpointercancel=()=>ptt(false);
  b.oncontextmenu=e=>e.preventDefault();
}
async function enableVoice(){
  if(!navigator.mediaDevices){alert("La voce non è disponibile su questo browser");return}
  try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){alert("Consenti a Chrome di usare il microfono per parlare");return}
  try{await setupVoiceGraph();mic.getAudioTracks().forEach(t=>t.enabled=true)}catch(e){vg=null;voiceOut=null;mic.getAudioTracks().forEach(t=>t.enabled=false)}
  Object.keys(calls).forEach(dropCall);vcDraw();send({t:"v",on:true});
}
addEventListener("keydown",e=>{if(e.code=="Space"&&mic&&e.target.tagName!="INPUT"){e.preventDefault();if(!e.repeat)ptt(true)}});
addEventListener("keyup",e=>{if(e.code=="Space"&&mic&&e.target.tagName!="INPUT"){e.preventDefault();ptt(false)}});
addEventListener("blur",()=>ptt(false));

$("#out").onclick=leaveTable;
$("#mn").onclick=()=>$("#bar").classList.toggle("open");
$("#mnl").onclick=e=>{if(e.target.tagName=="BUTTON")$("#bar").classList.remove("open")};
$("#rcb").onclick=repList;
$("#lbb").onclick=lbDraw;
$("#lgb").onclick=lgDraw;
$("#ntb").onclick=netTest;
$("#pro").onclick=()=>{profDraw();$("#cfg").style.display="block"};
IDB.all().then(o=>{for(const k in o){const[sl,e]=k.split("|");(FAV[sl]||(FAV[sl]={}))[e]=o[k]}}).catch(()=>{});
$("#sty").onclick=()=>{cfgDraw();$("#cfg").style.display="block"};
applySkin();mkFilter();
home();
</script>
